<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO26 App - 标注页面</title>
    <style id="theme-vars">
:root {
  /* Background layers */
  --color-base: #1e1e2e;
  --color-mantle: #181825;
  --color-crust: #11111b;
  --color-surface-0: #313244;
  --color-surface-1: #45475a;
  --color-surface-2: #585b70;

  /* Text */
  --color-text: #cdd6f4;
  --color-text-subtle: #a6adc8;
  --color-text-muted: #7f849c;

  /* Accent colors */
  --color-primary: #89b4fa;
  --color-primary-hover: #b4befe;
  --color-success: #a6e3a1;
  --color-success-bg: #1e3a2e;
  --color-warning: #f9e2af;
  --color-warning-bg: #3a3520;
  --color-danger: #f38ba8;
  --color-danger-bg: #3a1e2a;

  /* Fonts */
  --font-sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;

  /* Font sizes */
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 13px;
  --font-size-md: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.05);

  /* Transitions */
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <div class="app">

    <!-- ============ Toolbar ============ -->
    <div class="toolbar">

      <!-- Group 1: Drawing tools -->
      <div class="toolbar-group">
        <button class="toolbar-btn active" title="矩形标注 (R)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="4.5" width="10" height="7" rx="1"/></svg>
          矩形
        </button>
        <button class="toolbar-btn" title="多边形标注 (P)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 3 L13 7 L11 13 L5 13 L3 7 Z"/></svg>
          多边形
        </button>
        <button class="toolbar-btn" title="关键点标注 (K)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 4 L8 7 L11 4 M8 7 L8 11"/><circle cx="5" cy="4" r="1.5" fill="currentColor" stroke="none"/><circle cx="11" cy="4" r="1.5" fill="currentColor" stroke="none"/><circle cx="8" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="8" cy="11" r="1.5" fill="currentColor" stroke="none"/></svg>
          关键点
        </button>
        <button class="toolbar-btn" title="选择 (V)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M4 3 L4 12.5 L6.5 10 L8.5 13.5 L10 12.5 L8 9.5 L11.5 9.5 Z"/></svg>
          选择
        </button>
      </div>

      <div class="toolbar-separator"></div>

      <!-- Group 2: Edit -->
      <div class="toolbar-group">
        <button class="toolbar-btn" title="删除选中标注 (Del)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 H13 M6.5 5 V3.5 H9.5 V5 M5 5 L5.5 13 H10.5 L11 5"/><path d="M7 7.5 V10.5 M9 7.5 V10.5"/></svg>
          删除
        </button>
        <button class="toolbar-btn" title="清空所有标注">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3 L13 5 L7 11 L4 11 L3 10 L9 4 Z"/><path d="M3 10 L2 13"/></svg>
          清空
        </button>
      </div>

      <div class="toolbar-separator"></div>

      <!-- Group 3: AI / Advanced -->
      <div class="toolbar-group">
        <button class="toolbar-btn" title="SAM 智能分割">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 L10 6 M10 6 L11.5 4.5 L13.5 6.5 L12 8 Z"/><path d="M3 4 L5 4 M4 3 L4 5 M6.5 2.5 L6.5 3.5"/></svg>
          SAM
        </button>
        <button class="toolbar-btn" title="文本标注 (T)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4 H13 M8 4 V13 M6 13 H10"/></svg>
          文本
        </button>
        <button class="toolbar-btn" title="逐帧标注模式">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="4" width="11" height="8" rx="1"/><path d="M5.5 4 V12 M10.5 4 V12"/><circle cx="4" cy="5.5" r="0.4" fill="currentColor"/><circle cx="4" cy="10.5" r="0.4" fill="currentColor"/><circle cx="12" cy="5.5" r="0.4" fill="currentColor"/><circle cx="12" cy="10.5" r="0.4" fill="currentColor"/></svg>
          逐帧
        </button>
      </div>

      <div class="toolbar-separator"></div>

      <!-- Group 4: Import -->
      <div class="toolbar-group">
        <button class="toolbar-btn" title="导入图片">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="9" height="9" rx="1"/><circle cx="5" cy="5.5" r="1"/><path d="M2 8 L4.5 6 L6.5 7.5 L8 6 L11 8.5"/><path d="M13 10 V14 M11 12 L13 14 L15 12"/></svg>
          导入图片
        </button>
        <button class="toolbar-btn" title="导入视频">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="9" height="7" rx="1"/><path d="M8 5.5 V7.5 L9.5 6.5 Z" fill="currentColor"/><path d="M13 9 V14 M11 12 L13 14 L15 12"/></svg>
          导入视频
        </button>
        <button class="toolbar-btn" title="导入目录">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4 H6 L7.5 5.5 H12 V9 H2 Z"/><path d="M13 10 V14 M11 12 L13 14 L15 12"/></svg>
          导入目录
        </button>
        <button class="toolbar-btn" title="清空图片列表">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="9" height="9" rx="1"/><circle cx="5" cy="6" r="1"/><path d="M2 9 L5 7 L7 8.5 L11 5.5"/><path d="M11 11 L14 14 M14 11 L11 14"/></svg>
          清空图片
        </button>
      </div>

      <div class="toolbar-separator"></div>

      <!-- Group 5: Export -->
      <div class="toolbar-group">
        <button class="toolbar-btn" title="导出标注">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11 V3 M5 6 L8 3 L11 6"/><path d="M3 12 V14 H13 V12"/></svg>
          导出
        </button>
      </div>

    </div>

    <!-- ============ Main Content ============ -->
    <div class="main">

      <!-- ============ Left Panel ============ -->
      <div class="left-panel">

        <!-- Image List -->
        <div class="panel-card flex-grow">
          <div class="panel-header">
            <div class="panel-header-title">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="5.5" cy="6.5" r="1"/><path d="M2 10 L5 8 L7 9.5 L10 7 L14 10.5"/></svg>
              图片列表
            </div>
            <span class="panel-count">5</span>
          </div>
          <div class="image-list-items">

            <div class="image-item">
              <div class="image-thumb" style="background: linear-gradient(135deg, #1e1e2e 0%, #45475a 60%, #89b4fa 100%);">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="5.5" cy="6.5" r="1"/><path d="M2 10 L5 8 L7 9.5 L10 7 L14 10.5"/></svg>
              </div>
              <div class="image-info">
                <span class="image-name">IMG_0001.jpg</span>
                <div class="image-meta">
                  <span class="image-badge">12</span>
                  <span class="image-dims">1920×1080</span>
                </div>
              </div>
            </div>

            <div class="image-item">
              <div class="image-thumb" style="background: linear-gradient(135deg, #1e1e2e 0%, #45475a 60%, #a6e3a1 100%);">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="5.5" cy="6.5" r="1"/><path d="M2 10 L5 8 L7 9.5 L10 7 L14 10.5"/></svg>
              </div>
              <div class="image-info">
                <span class="image-name">IMG_0002.jpg</span>
                <div class="image-meta">
                  <span class="image-badge">8</span>
                  <span class="image-dims">1920×1080</span>
                </div>
              </div>
            </div>

            <div class="image-item selected">
              <div class="image-thumb" style="background: linear-gradient(135deg, #1e1e2e 0%, #45475a 60%, #f38ba8 100%);">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="5.5" cy="6.5" r="1"/><path d="M2 10 L5 8 L7 9.5 L10 7 L14 10.5"/></svg>
              </div>
              <div class="image-info">
                <span class="image-name">IMG_0003.jpg</span>
                <div class="image-meta">
                  <span class="image-badge">15</span>
                  <span class="image-dims">1920×1080</span>
                </div>
              </div>
            </div>

            <div class="image-item">
              <div class="image-thumb" style="background: linear-gradient(135deg, #1e1e2e 0%, #45475a 60%, #cba6f7 100%);">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="5.5" cy="6.5" r="1"/><path d="M2 10 L5 8 L7 9.5 L10 7 L14 10.5"/></svg>
              </div>
              <div class="image-info">
                <span class="image-name">IMG_0004.jpg</span>
                <div class="image-meta">
                  <span class="image-badge">3</span>
                  <span class="image-dims">1280×720</span>
                </div>
              </div>
            </div>

            <div class="image-item">
              <div class="image-thumb" style="background: linear-gradient(135deg, #1e1e2e 0%, #45475a 60%, #f9e2af 100%);">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="5.5" cy="6.5" r="1"/><path d="M2 10 L5 8 L7 9.5 L10 7 L14 10.5"/></svg>
              </div>
              <div class="image-info">
                <span class="image-name">IMG_0005.jpg</span>
                <div class="image-meta">
                  <span class="image-badge empty">0</span>
                  <span class="image-dims">1280×720</span>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- 2px Separator -->
        <div class="panel-separator"></div>

        <!-- Class Panel -->
        <div class="panel-card">
          <div class="panel-header">
            <div class="panel-header-title">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="2.5"/><circle cx="11" cy="11" r="2.5"/><path d="M5 7.5 V11 M11 5.5 V8.5"/></svg>
              类别面板
            </div>
            <span class="panel-count">3</span>
          </div>
          <div class="class-list">

            <div class="class-item active">
              <span class="class-dot red"></span>
              <span class="class-name">person</span>
              <span class="class-shortcut">1</span>
              <span class="class-count">24</span>
            </div>

            <div class="class-item">
              <span class="class-dot blue"></span>
              <span class="class-name">car</span>
              <span class="class-shortcut">2</span>
              <span class="class-count">18</span>
            </div>

            <div class="class-item">
              <span class="class-dot green"></span>
              <span class="class-name">bike</span>
              <span class="class-shortcut">3</span>
              <span class="class-count">6</span>
            </div>

          </div>
          <div class="class-controls">
            <button class="class-btn add" title="添加类别">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 4 V12 M4 8 H12"/></svg>
              <span class="class-btn-label">添加</span>
            </button>
            <button class="class-btn remove" title="删除类别">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8 H12"/></svg>
              <span class="class-btn-label">删除</span>
            </button>
          </div>
        </div>

      </div>

      <!-- ============ Canvas Area ============ -->
      <div class="canvas-area">
        <div class="canvas-placeholder">
          <div class="canvas-corners">
            <div class="canvas-corner tl"></div>
            <div class="canvas-corner tr"></div>
            <div class="canvas-corner bl"></div>
            <div class="canvas-corner br"></div>
          </div>
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="8" width="32" height="32" rx="2"/>
            <circle cx="17" cy="17" r="3"/>
            <path d="M8 30 L16 24 L22 28 L30 20 L40 28"/>
          </svg>
          <span class="canvas-placeholder-text">标注画布</span>
          <span class="canvas-placeholder-hint">从左侧图片列表选择图片开始标注</span>
        </div>

        <div class="canvas-status">
          <div class="canvas-status-group">
            <div class="canvas-status-item">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="5.5" cy="6.5" r="1"/><path d="M2 10 L5 8 L7 9.5 L10 7 L14 10.5"/></svg>
              <span>IMG_0003.jpg</span>
            </div>
            <div class="canvas-status-item">
              <span>1920 × 1080</span>
            </div>
          </div>
          <div class="canvas-status-group">
            <div class="canvas-status-item">
              <span>缩放 100%</span>
            </div>
            <div class="canvas-status-item">
              <span>x: 0, y: 0</span>
            </div>
            <div class="canvas-status-item">
              <span>标注: 15</span>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

    <style>
    /* ============ Reset ============ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--color-crust);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: var(--font-size-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ============ App Container ============ */
    .app {
      width: 1440px;
      height: 852px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--color-base);
      overflow: hidden;
    }

    /* ============ Toolbar ============ */
    .toolbar {
      height: 48px;
      flex-shrink: 0;
      background: var(--color-mantle);
      border-bottom: 1px solid var(--color-surface-0);
      display: flex;
      align-items: center;
      padding: 0 var(--space-3);
      gap: 0;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .toolbar-separator {
      width: 1px;
      height: 24px;
      background: var(--color-surface-1);
      margin: 0 var(--space-2);
      flex-shrink: 0;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--color-surface-1);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text-subtle);
      font-family: var(--font-sans);
      font-size: var(--font-size-sm);
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    }

    .toolbar-btn:hover {
      background: var(--color-surface-0);
      color: var(--color-text);
      border-color: var(--color-surface-2);
    }

    .toolbar-btn.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-crust);
    }

    .toolbar-btn.active:hover {
      background: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
    }

    .toolbar-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .toolbar-spacer {
      flex: 1;
    }

    .toolbar-info {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-1) var(--space-3);
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      font-family: var(--font-mono);
    }

    /* ============ Main Content ============ */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ============ Left Panel ============ */
    .left-panel {
      width: 280px;
      flex-shrink: 0;
      background: var(--color-mantle);
      border-right: 1px solid var(--color-surface-0);
      display: flex;
      flex-direction: column;
      padding: var(--space-2);
      gap: var(--space-2);
    }

    .panel-card {
      background: var(--color-surface-0);
      border: 1px solid var(--color-surface-1);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-card.flex-grow {
      flex: 1;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-2) var(--space-3);
      background: var(--color-surface-1);
      border-bottom: 1px solid var(--color-surface-1);
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text-subtle);
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .panel-header-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .panel-header-title svg {
      width: 14px;
      height: 14px;
      color: var(--color-text-muted);
    }

    .panel-count {
      padding: 0 var(--space-2);
      background: var(--color-surface-2);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xs);
      color: var(--color-text-subtle);
      font-family: var(--font-mono);
      line-height: 18px;
    }

    /* ============ Image List ============ */
    .image-list-items {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-2);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .image-list-items::-webkit-scrollbar {
      width: 6px;
    }

    .image-list-items::-webkit-scrollbar-track {
      background: transparent;
    }

    .image-list-items::-webkit-scrollbar-thumb {
      background: var(--color-surface-1);
      border-radius: var(--radius-sm);
    }

    .image-list-items::-webkit-scrollbar-thumb:hover {
      background: var(--color-surface-2);
    }

    .image-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-1);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }

    .image-item:hover {
      background: var(--color-surface-1);
    }

    .image-item.selected {
      background: var(--color-surface-1);
      border-color: var(--color-primary);
    }

    .image-thumb {
      width: 64px;
      height: 48px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-surface-2);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .image-thumb svg {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .image-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .image-name {
      font-size: var(--font-size-sm);
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .image-meta {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .image-badge {
      display: inline-flex;
      align-items: center;
      padding: 0 var(--space-1);
      background: var(--color-surface-2);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xs);
      color: var(--color-text-subtle);
      font-family: var(--font-mono);
      line-height: 16px;
    }

    .image-item.selected .image-badge {
      background: var(--color-primary);
      color: var(--color-crust);
    }

    .image-badge.empty {
      background: transparent;
      color: var(--color-text-muted);
    }

    .image-dims {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      font-family: var(--font-mono);
    }

    /* ============ Panel Separator ============ */
    .panel-separator {
      height: 2px;
      background: var(--color-surface-1);
      border-radius: 1px;
      flex-shrink: 0;
    }

    /* ============ Class Panel ============ */
    .class-list {
      flex: 1;
      padding: var(--space-2);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      overflow-y: auto;
    }

    .class-list::-webkit-scrollbar {
      width: 6px;
    }

    .class-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .class-list::-webkit-scrollbar-thumb {
      background: var(--color-surface-1);
      border-radius: var(--radius-sm);
    }

    .class-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-1) var(--space-2);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }

    .class-item:hover {
      background: var(--color-surface-1);
    }

    .class-item.active {
      background: var(--color-surface-1);
      border-color: var(--color-primary);
    }

    .class-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }

    .class-dot.red {
      background: var(--color-danger);
      color: var(--color-danger);
    }

    .class-dot.blue {
      background: var(--color-primary);
      color: var(--color-primary);
    }

    .class-dot.green {
      background: var(--color-success);
      color: var(--color-success);
    }

    .class-name {
      font-size: var(--font-size-sm);
      color: var(--color-text);
      flex: 1;
    }

    .class-shortcut {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1px solid var(--color-surface-2);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      font-family: var(--font-mono);
    }

    .class-count {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      font-family: var(--font-mono);
    }

    .class-controls {
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2);
      border-top: 1px solid var(--color-surface-1);
      flex-shrink: 0;
    }

    .class-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      height: 28px;
      padding: 0 var(--space-3);
      border: 1px solid var(--color-surface-1);
      border-radius: var(--radius-sm);
      background: var(--color-surface-0);
      color: var(--color-text-subtle);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    }

    .class-btn:hover {
      background: var(--color-surface-1);
      color: var(--color-text);
      border-color: var(--color-surface-2);
    }

    .class-btn.add:hover {
      border-color: var(--color-success);
      color: var(--color-success);
    }

    .class-btn.remove:hover {
      border-color: var(--color-danger);
      color: var(--color-danger);
    }

    .class-btn svg {
      width: 14px;
      height: 14px;
    }

    .class-btn-label {
      font-size: var(--font-size-sm);
    }

    /* ============ Canvas Area ============ */
    .canvas-area {
      flex: 1;
      background: var(--color-crust);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .canvas-area::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--color-mantle) 1px, transparent 1px),
        linear-gradient(90deg, var(--color-mantle) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
    }

    .canvas-placeholder {
      width: 640px;
      height: 440px;
      border: 2px dashed var(--color-surface-1);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      position: relative;
      z-index: 1;
    }

    .canvas-placeholder svg {
      width: 48px;
      height: 48px;
      color: var(--color-surface-2);
    }

    .canvas-placeholder-text {
      font-size: var(--font-size-xl);
      color: var(--color-text-muted);
      letter-spacing: 4px;
      font-weight: 500;
    }

    .canvas-placeholder-hint {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      opacity: 0.7;
    }

    .canvas-corners {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .canvas-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--color-surface-2);
      border-style: solid;
      border-width: 0;
    }

    .canvas-corner.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
    .canvas-corner.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
    .canvas-corner.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
    .canvas-corner.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

    .canvas-status {
      position: absolute;
      bottom: var(--space-3);
      left: var(--space-3);
      right: var(--space-3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      font-family: var(--font-mono);
      z-index: 2;
    }

    .canvas-status-group {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .canvas-status-item {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .canvas-status-item svg {
      width: 12px;
      height: 12px;
    }
  </style>
</body>
</html>
