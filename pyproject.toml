[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo26-app"
version = "1.0.0"
description = "Ultralytics YOLO Desktop App - Annotation, Training, and Inference (YOLO26 / YOLOv8)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["yolo", "yolo26", "yolov8", "object-detection", "pyqt6", "desktop-app"]
authors = [
    {name = "YOLO26 App Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "ultralytics>=8.0",
    "PyQt6>=6.0",
    "opencv-python>=4.6.0",
    "numpy>=1.20.0",
    "pyyaml>=5.3.1",
    "pyqtgraph>=0.13.0",
]

[project.optional-dependencies]
sam = ["sam2"]
dino = ["groundingdino-pip"]
realsense = ["pyrealsense2>=2.50.0"]
# TensorRT 10.x 需 Ultralytics ≥ 8.3.0(BuilderFlag.FP16 已改名 kFP16)
tensorrt = ["tensorrt>=8.6"]
all = ["sam2", "groundingdino-pip", "pyrealsense2>=2.50.0", "tensorrt>=8.6"]

[tool.setuptools.packages.find]
where = ["code"]
include = ["yolo26_app*"]
