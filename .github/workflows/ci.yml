name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      # Torch 2.11 requires setuptools<82. PYSEC-2026-3447 only affects
      # macOS source-distribution MANIFEST exclusion normalization; builds use
      # the isolated setuptools>=83 backend declared in pyproject.toml.
      - run: python -m pip_audit --local --ignore-vuln PYSEC-2026-3447

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -vv

  package:
    name: Build package distributions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Verify source distribution contents
        run: >-
          python -c "from pathlib import Path; import tarfile; archive = next(Path('dist').glob('*.tar.gz')); names = tarfile.open(archive).getnames(); assert any(name.endswith('docs/README.md') for name in names); assert any(name.endswith('code/yolo26_app/core/config_template.yaml') for name in names); assert any(name.endswith('code/yolo26_app/ui/icons/nav-annotate.svg') for name in names)"
      - run: python -m venv .wheel-test-env
      - name: Install the built wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          if ($null -eq $wheel) {
            throw "No wheel distribution was built."
          }
          & .\.wheel-test-env\Scripts\python.exe -m pip install --no-deps --force-reinstall $wheel.FullName
      - name: Verify wheel resources and GUI entry point metadata
        run: >-
          .\.wheel-test-env\Scripts\python.exe -c "from importlib.metadata import entry_points; from importlib.resources import files; root = files('yolo26_app'); assert root.joinpath('core/config_template.yaml').is_file(); assert root.joinpath('ui/icons/nav-annotate.svg').is_file(); assert any(entry.name == 'yolo26-app' and entry.value == 'yolo26_app.app:main' for entry in entry_points(group='gui_scripts'))"
      - name: Verify Windows GUI launcher
        shell: pwsh
        run: |
          if (-not (Test-Path ".wheel-test-env/Scripts/yolo26-app.exe")) {
            throw "GUI launcher was not created."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
