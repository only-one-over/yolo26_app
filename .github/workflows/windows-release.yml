name: Windows onedir release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v1.0.1"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Windows ${{ matrix.variant }} onedir
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            torch_index: https://download.pytorch.org/whl/cpu
            torch_version: 2.3.1
            torchvision_version: 0.18.1
          - variant: cuda
            torch_index: https://download.pytorch.org/whl/cu121
            torch_version: 2.3.1
            torchvision_version: 0.18.1
          - variant: cuda-full
            torch_index: https://download.pytorch.org/whl/cu121
            torch_version: 2.5.1
            torchvision_version: 0.20.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ${{ matrix.variant }} runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 opencv-python==4.10.0.84 lap>=0.5.12
          python -m pip install torch==${{ matrix.torch_version }} torchvision==${{ matrix.torchvision_version }} --index-url ${{ matrix.torch_index }}
          if ("${{ matrix.variant }}" -eq "cuda-full") {
            $env:SAM2_BUILD_CUDA = "0"
            python -m pip install "git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"
            python tools/fetch_pretrained_assets.py
          }
          python -m pip install .
          python -m pip install "pyinstaller>=6.14,<7"
      - name: Build portable onedir archive
        run: python tools/build_windows_onedir.py --variant ${{ matrix.variant }} --output-dir release
      - name: Verify CUDA-Full runtime resources
        if: matrix.variant == 'cuda-full'
        shell: pwsh
        run: |
          $app = 'release/YOLO26-App-CUDA-FULL'
          $required = @(
            'pretrained/manifest.json',
            'pretrained/yolo/yolo26n.pt',
            'pretrained/yolo/yolo26s.pt',
            'pretrained/sam2/sam2.1_hiera_tiny.pt'
          )
          foreach ($relativePath in $required) {
            if (-not (Test-Path (Join-Path $app $relativePath))) {
              throw "Missing CUDA-Full runtime resource: $relativePath"
            }
          }
          $sam2PackagePaths = @(
            (Join-Path $app 'sam2'),
            (Join-Path $app '_internal/sam2')
          )
          if (-not ($sam2PackagePaths | Where-Object { Test-Path $_ })) {
            throw 'SAM2 package was not collected into CUDA-Full.'
          }
      - name: Verify archive layout
        shell: pwsh
        run: |
          $launcher = "release/YOLO26-App-${{ matrix.variant }}/YOLO26-App-${{ matrix.variant }}.exe"
          if (-not (Test-Path $launcher)) {
            throw "Portable launcher was not found: $launcher"
          }
          if (-not (Test-Path "release/YOLO26-App-${{ matrix.variant }}/build-info.json")) {
            throw "Build metadata was not found."
          }
          $assets = Get-ChildItem -Path release -Filter "YOLO26-App-${{ matrix.variant }}.zip*"
          if ($assets.Count -eq 0) {
            throw "No Release archive or archive parts were created."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: yolo26-app-windows-${{ matrix.variant }}
          path: |
            release/*.zip
            release/*.zip.sha256
            release/*.zip.part*
            release/*.reassemble.ps1
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Select release tag
        id: release_tag
        shell: bash
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            release/*.zip
            release/*.zip.sha256
            release/*.zip.part*
            release/*.reassemble.ps1
          fail_on_unmatched_files: true
